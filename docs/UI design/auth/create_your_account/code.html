<!-- Micro-interaction: Confetti Script -->
<script>
        function createConfetti() {
            const colors = ['#0058be', '#006c49', '#f9bd22', '#6cf8bb'];
            const container = document.body;
            
            for (let i = 0; i < 30; i++) {
                const dot = document.createElement('div');
                dot.className = 'confetti-dot';
                dot.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                dot.style.left = Math.random() * 100 + 'vw';
                dot.style.top = '-10px';
                dot.style.opacity = Math.random();
                dot.style.transform = `scale(${Math.random() * 1.5})`;
                
                container.appendChild(dot);
                
                const animation = dot.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${(Math.random() - 0.5) * 200}px, ${window.innerHeight + 20}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: 2000 + Math.random() * 3000,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                    fill: 'forwards'
                });

                animation.onfinish = () => dot.remove();
            }
        }

        // Trigger confetti on load to celebrate lesson completion
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 500);
        });

        // Hover effect for Primary Button
        const mainCta = document.querySelector('.primary-tactile');
        if (mainCta) {
            mainCta.addEventListener('mouseenter', () => {
                mainCta.style.transform = 'scale(1.02) translateY(-2px)';
            });
            mainCta.addEventListener('mouseleave', () => {
                mainCta.style.transform = 'scale(1) translateY(0)';
            });
        }
    </script>
