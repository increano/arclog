<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Button Shadow Technique from Style Guide */
        .btn-tactile {
            box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.1);
            transition: all 0.1s ease;
        }
        .btn-tactile:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.1);
        }

        /* Glass Shine for Progress Bar */
        .progress-shine {
            background: linear-gradient(90deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.3) 100%);
        }

        .drop-zone {
            min-height: 3rem;
            transition: background-color 0.2s;
        }
        
        .word-pill {
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }

        .dragging {
            opacity: 0.5;
            transform: scale(0.95);
        }

        /* Tonal depth from Style Guide */
        .card-level-1 {
            border: 2px solid #E2E8F0;
            box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.05);
        }
    </style>

<body class="bg-background text-on-background font-body-regular min-h-screen flex flex-col">
<!-- Top Navigation Header -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface dark:bg-surface-dim border-b-2 border-outline-variant dark:border-outline md:px-lg">
<div class="flex items-center gap-base">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<span class="font-display-lg-mobile text-display-lg-mobile font-bold text-primary">BibleQuest</span>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">local_fire_department</span>
<span class="font-label-bold text-label-bold text-on-surface">3 Day Streak</span>
</div>
</header>
<main class="flex-1 w-full max-w-[1200px] mx-auto px-margin-mobile pt-24 pb-32 flex flex-col items-center">
<!-- Progress Bar Section -->
<div class="w-full mb-lg">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-bold text-label-bold text-on-surface-variant">John 1:1 Challenge</span>
<span class="font-label-bold text-label-bold text-secondary">60% Complete</span>
</div>
<div class="w-full h-4 bg-surface-container-high rounded-full overflow-hidden relative">
<div class="h-full w-[60%] bg-secondary-fixed-dim rounded-full relative">
<div class="absolute inset-0 progress-shine opacity-50"></div>
</div>
</div>
</div>
<!-- Translation Toggle -->
<div class="flex bg-surface-container-low rounded-full p-1 mb-xl card-level-1">
<button class="px-6 py-2 rounded-full font-label-bold text-label-bold bg-primary text-on-primary transition-all shadow-md">KJV</button>
<button class="px-6 py-2 rounded-full font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high transition-all">ESV</button>
<button class="px-6 py-2 rounded-full font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high transition-all">NIV</button>
</div>
<!-- Scripture Quote Card -->
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-3xl p-md md:p-lg card-level-1 mb-xl relative overflow-hidden">
<div class="absolute top-0 left-0 w-2 h-full bg-primary opacity-20"></div>
<div class="mb-md">
<span class="font-headline-md text-headline-md text-primary opacity-50">"</span>
<h2 class="font-scripture-quote text-scripture-quote text-on-surface text-center px-md italic leading-relaxed">
                    In the beginning was the Word, and the Word was with God, and the Word was God.
                </h2>
<div class="text-right">
<span class="font-headline-md text-headline-md text-primary opacity-50">"</span>
</div>
</div>
<div class="flex justify-center">
<span class="bg-primary-container text-on-primary-container px-4 py-1 rounded-full font-label-bold text-label-bold">John 1:1</span>
</div>
</div>
<!-- Scramble Interaction Area -->
<div class="w-full max-w-3xl">
<p class="text-center font-label-bold text-label-bold text-on-surface-variant mb-md">RECONSTRUCT THE VERSE</p>
<!-- Target Sequence Area -->
<div class="w-full min-h-[120px] bg-surface-container p-md rounded-2xl border-2 border-dashed border-outline-variant flex flex-wrap gap-base justify-center content-start mb-lg transition-all duration-300" id="target-area">
<!-- Drop indicators or selected words go here -->
</div>
<!-- Scattered Words Bank -->
<div class="flex flex-wrap gap-base justify-center mb-xl" id="source-bank">
<div class="word-pill px-6 py-3 bg-surface-bright border-2 border-outline-variant rounded-xl font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high btn-tactile" draggable="true">Word</div>
<div class="word-pill px-6 py-3 bg-surface-bright border-2 border-outline-variant rounded-xl font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high btn-tactile" draggable="true">Beginning</div>
<div class="word-pill px-6 py-3 bg-surface-bright border-2 border-outline-variant rounded-xl font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high btn-tactile" draggable="true">Was</div>
<div class="word-pill px-6 py-3 bg-surface-bright border-2 border-outline-variant rounded-xl font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high btn-tactile" draggable="true">The</div>
<div class="word-pill px-6 py-3 bg-surface-bright border-2 border-outline-variant rounded-xl font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high btn-tactile" draggable="true">God</div>
<div class="word-pill px-6 py-3 bg-surface-bright border-2 border-outline-variant rounded-xl font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high btn-tactile" draggable="true">With</div>
<div class="word-pill px-6 py-3 bg-surface-bright border-2 border-outline-variant rounded-xl font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high btn-tactile" draggable="true">And</div>
<div class="word-pill px-6 py-3 bg-surface-bright border-2 border-outline-variant rounded-xl font-label-bold text-label-bold text-on-surface-variant hover:bg-surface-container-high btn-tactile" draggable="true">In</div>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full p-md bg-surface dark:bg-surface-dim border-t-2 border-outline-variant dark:border-outline flex justify-center items-center gap-md z-50">
<div class="max-w-2xl w-full flex gap-base items-center">
<button class="p-md rounded-2xl bg-surface-container-highest text-primary hover:bg-primary-container hover:text-on-primary-container transition-all">
<span class="material-symbols-outlined">lightbulb</span>
</button>
<button class="flex-1 py-md bg-primary text-on-primary font-display-lg-mobile text-display-lg-mobile rounded-2xl btn-tactile flex items-center justify-center gap-base" id="check-btn">
                Check Answer
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Confetti & Feedback Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const wordPills = document.querySelectorAll('.word-pill');
            const targetArea = document.getElementById('target-area');
            const sourceBank = document.getElementById('source-bank');
            const checkBtn = document.getElementById('check-btn');

            let draggedItem = null;

            wordPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    const parent = pill.parentElement;
                    if (parent === sourceBank) {
                        targetArea.appendChild(pill);
                        pill.classList.remove('bg-surface-bright');
                        pill.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
                    } else {
                        sourceBank.appendChild(pill);
                        pill.classList.add('bg-surface-bright');
                        pill.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary');
                    }
                });

                pill.addEventListener('dragstart', (e) => {
                    draggedItem = pill;
                    setTimeout(() => pill.classList.add('dragging'), 0);
                });

                pill.addEventListener('dragend', () => {
                    draggedItem = null;
                    pill.classList.remove('dragging');
                });
            });

            targetArea.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            targetArea.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedItem) {
                    targetArea.appendChild(draggedItem);
                    draggedItem.classList.remove('bg-surface-bright');
                    draggedItem.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary');
                }
            });

            checkBtn.addEventListener('click', () => {
                // Micro-interaction for feedback
                const rect = checkBtn.getBoundingClientRect();
                
                // Simple feedback logic
                if (targetArea.children.length === 0) {
                    checkBtn.classList.add('bg-error');
                    checkBtn.innerText = "Add words first!";
                    setTimeout(() => {
                        checkBtn.classList.remove('bg-error');
                        checkBtn.innerHTML = 'Check Answer <span class="material-symbols-outlined">arrow_forward</span>';
                    }, 1500);
                    return;
                }

                // Success simulation
                checkBtn.classList.add('bg-secondary');
                checkBtn.innerText = "Excellent!";
                
                // Achievement micro-interaction simulation
                const achievement = document.createElement('div');
                achievement.className = 'fixed inset-0 pointer-events-none flex items-center justify-center z-[100]';
                achievement.innerHTML = `
                    <div class="bg-tertiary-fixed border-4 border-tertiary text-on-tertiary-fixed p-xl rounded-3xl animate-bounce flex flex-col items-center gap-md shadow-2xl">
                        <span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
                        <h3 class="font-display-lg text-display-lg">Verse Master!</h3>
                        <p class="font-label-bold text-label-bold">+50 XP Earned</p>
                    </div>
                `;
                document.body.appendChild(achievement);
                
                setTimeout(() => {
                    achievement.style.opacity = '0';
                    achievement.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => document.body.removeChild(achievement), 500);
                }, 2000);
            });
        });
    </script>
</body></html>
